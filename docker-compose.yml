services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      # Порт на хосте можно переопределить в .env, если 5432 уже занят
      # локально установленным PostgreSQL: POSTGRES_HOST_PORT=5434
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: shop_backend
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      RUN_MIGRATIONS: "true"
      # Секреты не хардкодятся: значения берутся из .env рядом с compose-файлом,
      # а если переменной нет — подставляется пустая строка и алертинг молчит.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ALERTS_ENABLED: "${ALERTS_ENABLED:-true}"
      PARTITION_TABLE: "${PARTITION_TABLE:-orders}"
      PARTITION_HORIZON_DAYS: "${PARTITION_HORIZON_DAYS:-3}"
      PARTITION_GRANULARITY: "${PARTITION_GRANULARITY:-month}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      PARTITION_CREATE_HOUR: "${PARTITION_CREATE_HOUR:-1}"
      PARTITION_CHECK_INTERVAL_MINUTES: "${PARTITION_CHECK_INTERVAL_MINUTES:-15}"
    ports:
      # Порт на хосте можно переопределить в .env: на Windows 8000 иногда
      # попадает в зарезервированный Hyper-V диапазон и не биндится.
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts

volumes:
  pgdata:
