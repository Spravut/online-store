services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: shop_backend
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      RUN_MIGRATIONS: "true"
      # Секреты не хардкодятся: значения берутся из .env рядом с compose-файлом,
      # а если переменной нет — подставляется пустая строка и алертинг молчит.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ALERTS_ENABLED: "${ALERTS_ENABLED:-true}"
      PARTITION_TABLE: "${PARTITION_TABLE:-events}"
      PARTITION_HORIZON_DAYS: "${PARTITION_HORIZON_DAYS:-3}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts

volumes:
  pgdata:
