services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
      # Учётка для streaming replication. Создаётся init-скриптом при первом
      # запуске с пустым томом.
      REPLICATION_USER: "${REPLICATION_USER:-replicator}"
      REPLICATION_PASSWORD: "${REPLICATION_PASSWORD:-replpass}"
    ports:
      # Порт на хосте можно переопределить в .env, если 5432 уже занят
      # локально установленным PostgreSQL: POSTGRES_HOST_PORT=5434
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Replica: копия primary, принимает только чтение -----------------------
  # При первом старте забирает базовую копию через pg_basebackup и дальше
  # непрерывно проигрывает поток WAL с primary.
  postgres_replica:
    image: postgres:16-alpine
    container_name: shop_postgres_replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: "${REPLICATION_PASSWORD:-replpass}"
      REPLICATION_USER: "${REPLICATION_USER:-replicator}"
      REPLICATION_PASSWORD: "${REPLICATION_PASSWORD:-replpass}"
    ports:
      - "${POSTGRES_REPLICA_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    # Штатный entrypoint образа умеет только initdb, поэтому реплика
    # разворачивается своей командой. Первый аргумент не "postgres",
    # значит docker-entrypoint.sh просто выполнит скрипт.
    command: >
      sh -c '
      if [ ! -s "$$PGDATA/PG_VERSION" ]; then
        echo "инициализация реплики: pg_basebackup с primary";
        rm -rf "$$PGDATA"/*;
        su-exec postgres pg_basebackup -h postgres -p 5432 -U "$$REPLICATION_USER" -D "$$PGDATA" -Fp -Xs -P -R;
        echo "primary_conninfo = '"'"'host=postgres port=5432 user=$$REPLICATION_USER password=$$REPLICATION_PASSWORD application_name=shop_replica'"'"'" >> "$$PGDATA/postgresql.auto.conf";
        echo "hot_standby = on" >> "$$PGDATA/postgresql.auto.conf";
      fi;
      chown -R postgres:postgres "$$PGDATA";
      chmod 0700 "$$PGDATA";
      exec su-exec postgres postgres'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30

  # --- Шарды (лабораторные №5 и №6) ------------------------------------------
  # Четыре независимых PostgreSQL. Между ними нет ни репликации, ни общих
  # транзакций: связь только через router в приложении.
  #
  # shard3 поднят заранее, но в SHARD_URLS по умолчанию его нет — он нужен
  # для эксперимента "3 shards -> 4 shards" (задания 5 и 7 лабораторной №5).
  shard0: &shard
    image: postgres:16-alpine
    container_name: shop_shard0
    environment:
      POSTGRES_USER: shard
      POSTGRES_PASSWORD: shard
      POSTGRES_DB: shard
    ports:
      - "${SHARD0_HOST_PORT:-5440}:5432"
    volumes:
      - shard0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shard -d shard"]
      interval: 3s
      timeout: 3s
      retries: 20

  shard1:
    <<: *shard
    container_name: shop_shard1
    ports:
      - "${SHARD1_HOST_PORT:-5441}:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data

  shard2:
    <<: *shard
    container_name: shop_shard2
    ports:
      - "${SHARD2_HOST_PORT:-5442}:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data

  shard3:
    <<: *shard
    container_name: shop_shard3
    ports:
      - "${SHARD3_HOST_PORT:-5443}:5432"
    volumes:
      - shard3_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: shop_backend
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      # Пул для читающих запросов. Если переменная пустая, чтение идёт
      # в primary — сервис работает и без реплики.
      DATABASE_REPLICA_URL: "${DATABASE_REPLICA_URL-postgresql://shop:shop@postgres_replica:5432/shop}"
      RUN_MIGRATIONS: "true"
      # Секреты не хардкодятся: значения берутся из .env рядом с compose-файлом,
      # а если переменной нет — подставляется пустая строка и алертинг молчит.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ALERTS_ENABLED: "${ALERTS_ENABLED:-true}"
      PARTITION_TABLE: "${PARTITION_TABLE:-orders}"
      PARTITION_HORIZON_DAYS: "${PARTITION_HORIZON_DAYS:-3}"
      PARTITION_GRANULARITY: "${PARTITION_GRANULARITY:-month}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      PARTITION_CREATE_HOUR: "${PARTITION_CREATE_HOUR:-1}"
      PARTITION_CHECK_INTERVAL_MINUTES: "${PARTITION_CHECK_INTERVAL_MINUTES:-15}"
      # Шарды: порядок URL задаёт номера шардов (первый = shard 0).
      SHARD_URLS: "${SHARD_URLS-postgresql://shard:shard@shard0:5432/shard,postgresql://shard:shard@shard1:5432/shard,postgresql://shard:shard@shard2:5432/shard}"
      SHARD_STRATEGY: "${SHARD_STRATEGY:-consistent}"
      SHARD_VIRTUAL_NODES: "${SHARD_VIRTUAL_NODES:-150}"
    ports:
      # Порт на хосте можно переопределить в .env: на Windows 8000 иногда
      # попадает в зарезервированный Hyper-V диапазон и не биндится.
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      shard0:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./migrations_shard:/app/migrations_shard

volumes:
  pgdata:
  pgdata_replica:
  shard0_data:
  shard1_data:
  shard2_data:
  shard3_data:
